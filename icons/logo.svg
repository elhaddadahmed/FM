<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="110" fill="#0F172A" />

  <!-- Äußerer Ring -->
  <circle cx="250" cy="250" r="130" fill="none" stroke="#334155" stroke-width="12" />

  <!-- Mittlerer Ring (Aktiv) -->
  <circle cx="250" cy="250" r="85" fill="none" stroke="url(#targetGrad)" stroke-width="20" stroke-dasharray="380 40" stroke-linecap="round" />

  <!-- Zentrum / Plus (Sparen & Hinzufügen) -->
  <circle cx="250" cy="250" r="35" fill="#818CF8" />
  <path d="M 250,230 V 270 M 230,250 H 270" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
</svg>
