<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>FinanzManager</title>
<link rel="stylesheet" href="./style.css"/>

<!-- Supabase JS SDK: zuerst jsDelivr, bei Blockierung automatisch unpkg -->
<script>
(function () {
  function loadScript(src, onload, onerror) {
    var s = document.createElement("script");
    s.src = src;
    s.onload = onload;
    s.onerror = onerror;
    document.head.appendChild(s);
  }

  loadScript(
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    function () {
      window.__supabaseReady = true;
    },
    function () {
      loadScript(
        "https://unpkg.com/@supabase/supabase-js@2",
        function () {
          window.__supabaseReady = true;
        },
        function () {
          window.__supabaseReady = false;
        }
      );
    }
  );
})();
</script>

<!-- Optionale Bibliotheken -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
        onerror="console.warn('XLSX konnte nicht geladen werden – Excel-Export ggf. nicht verfügbar.');"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
        onerror="console.warn('jsPDF konnte nicht geladen werden – PDF-Export ggf. nicht verfügbar.');"></script>
</head>

<body>
<div id="root"></div>

<script src="./supabase-config.js"></script>

<script>
(function waitForSupabase() {
  if (window.supabase && window.__supabaseReady !== false) {
    var s = document.createElement("script");
    s.src = "./app.js";
    s.onload = function(){
      var ob = document.createElement("script");
      ob.src = "./open-banking.js";
      document.body.appendChild(ob);
    };
    document.body.appendChild(s);
    return;
  }

  if (window.__supabaseReady === false) {
    document.getElementById("root").innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#dce4fc;text-align:center">' +
      '<div style="max-width:520px"><div style="font-size:42px">⚠️</div>' +
      '<h2>Supabase konnte nicht geladen werden</h2>' +
      '<p style="color:#9aa9ca;line-height:1.6">Die Supabase-Bibliothek wurde von deinem Netzwerk oder Browser blockiert. Deaktiviere testweise einen Adblocker/Brave Shields für diese Seite und lade sie neu.</p>' +
      '</div></div>';
    return;
  }

  setTimeout(waitForSupabase, 50);
})();
</script>
</body>
</html>
